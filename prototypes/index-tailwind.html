}

function badge(vis) {

function btn(label, o) {
  o = o || {};

  var kind = o.kind === 'ghost' ? 'border border-line text-ink hover:bg-surface' : o.kind === 'danger' ? 'bg-danger text-white hover:opacity-90' : 'bg-accent text-white hover:opacity-90';
  var attrs = (o.href ? 'href="' + o.href + '"' : 'type="button"') + (o.act ? ' data-act="' + o.act + '"' : '') + (o.arg ? ' data-arg="' + o.arg + '"' : '') + (o.id ? ' id="' + o.id + '"' : '');

  return '<div class="rise"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="font-mono text-[12px] tracking-widest uppercase text-accent">ADMIN</p><h1 class="mt-1 font-display text-3xl font-bold tracking-tight">' + title + '</h1></div><div class="flex gap-2">' + (actions || '') + '</div></div>' +
    '<div class="scroll-x mt-6 border-b border-line"><div class="flex gap-6" role="tablist">' + tabs.map(function (t) { return '<a role="tab" href="#' + t[0] + '" aria-selected="' + (t[0] === tab) + '" class="whitespace-nowrap border-b-2 py-2 text-sm ' + (t[0] === tab ? 'border-accent font-medium text-accent' : 'border-transparent text-mute hover:text-ink') + '">' + t[1] + '</a>'; }).join('') + '</div></div>' +
    '<div class="mt-6">' + inner + '</div></div>';
}
function viewAdminLogin() {
  return '<div class="rise mx-auto max-w-md rounded-2xl border border-line bg-surface p-8"><p class="font-mono text-[12px] tracking-widest uppercase text-accent">ADMIN</p><h1 class="mt-1 font-display text-3xl font-bold">관리자 로그인</h1><p class="mt-3 text-sm text-mute">지정된 구글 계정으로만 글을 쓰고 고칠 수 있어요. 이메일·비밀번호 로그인은 쓰지 않아요.</p><div class="mt-6">' + btn(I.g + 'Google 계정으로 로그인', { act: 'admin-login', cls: 'w-full' }) + '</div><p class="mt-4 text-[12px] text-mute">방문자용 로그인은 상단의 Google 로그인 버튼이에요.</p></div>';
}
function viewAdminPosts() {
  var rows = POSTS.map(function (p) {
    var del = S.delId === p.id
      ? '<span class="inline-flex items-center gap-2 text-sm"><span class="text-danger">댓글 ' + p.comments.length + '개와 함께 삭제할까요?</span><button type="button" data-act="del-yes" data-arg="' + p.id + '" class="rounded bg-danger px-2 py-1 text-white">삭제</button><button type="button" data-act="del-no" class="rounded border border-line px-2 py-1">취소</button></span>'
      : '<a class="hover:text-accent" href="#post-' + p.id + '">보기</a><a class="hover:text-accent" href="#admin-write">수정</a><button type="button" data-act="del" data-arg="' + p.id + '" class="text-danger hover:underline">삭제</button>';
    return '<tr class="border-b border-line align-middle"><td class="py-3 pr-3"><div class="flex items-center gap-3"><div class="hidden w-16 shrink-0 overflow-hidden rounded border border-line aspect-[3/2] sm:block">' + art(p.art, 'h-full w-full') + '</div><span class="font-medium">' + esc(p.title) + '</span></div></td><td class="pr-3">' + chip(p.cat) + '</td><td class="pr-3">' + badge(p.vis) + '</td><td class="pr-3 font-mono text-[12px] text-mute tnum">' + p.date + '</td><td class="pr-3 text-right tnum">' + p.views + '</td><td class="pr-3 text-right tnum">' + p.comments.length + '</td><td class="flex items-center gap-3 py-3 text-sm whitespace-nowrap">' + del + '</td></tr>';
  }).join('');
  return adminShell('admin-posts', '글 관리',
    '<div class="scroll-x rounded-2xl border border-line bg-surface px-4"><table class="w-full min-w-[720px] text-left text-sm"><thead><tr class="border-b border-line font-mono text-[11px] uppercase tracking-widest text-mute"><th class="py-3 font-normal">제목</th><th class="font-normal">메뉴</th><th class="font-normal">공개</th><th class="font-normal">날짜</th><th class="text-right font-normal">조회</th><th class="text-right font-normal">댓글</th><th class="font-normal"><span class="sr-only">작업</span></th></tr></thead><tbody>' + (rows || '<tr><td colspan="7" class="py-10 text-center text-mute">글이 없어요. 새 글을 써 보세요.</td></tr>') + '</tbody></table></div>' +
    '<p class="mt-3 text-[12px] text-mute">삭제하면 그 글의 댓글·조회수·첨부 파일도 함께 지워지고 되돌릴 수 없어요.</p>',
    btn('새 글 쓰기', { href: '#admin-write' }));
}
function viewAdminWrite() {
  var tools = ['B', 'I', 'U', 'S', 'H2', 'H3', '• 목록', '1. 목록', '인용', '링크', '이미지'];
  var swatches = [0, 1, 2, 3, 4, 5].map(function (n) {
    return '<button type="button" data-act="thumb" data-arg="' + n + '" aria-pressed="' + (S.thumb === n) + '" class="overflow-hidden rounded-lg border-2 aspect-[3/2] ' + (S.thumb === n ? 'border-accent' : 'border-line') + '" aria-label="썸네일 ' + (n + 1) + '">' + art(n, 'h-full w-full') + '</button>';
  }).join('');
  var files = S.files.map(function (f, i) { return '<li class="flex items-center gap-3 px-3 py-2 text-sm"><span class="text-accent">' + I.file + '</span><span class="min-w-0 flex-1 break-all">' + esc(f) + '</span><button type="button" data-act="rmfile" data-arg="' + i + '" class="text-danger hover:underline">빼기</button></li>'; }).join('');
  var field = 'w-full rounded-lg border border-line bg-bg px-3 py-2.5 text-sm';
  return adminShell('admin-write', '새 글 쓰기',
    '<form id="wform" class="grid gap-8 lg:grid-cols-[1fr_320px]"><div class="space-y-5">' +
      '<label class="block"><span class="mb-1 block text-sm font-medium">제목</span><input id="w-title" class="' + field + ' !text-lg font-display" placeholder="글 제목"></label>' +
      '<label class="block"><span class="mb-1 block text-sm font-medium">한 줄 요약</span><input id="w-sum" class="' + field + '" placeholder="목록과 검색 결과에 보여요"></label>' +
      '<div><span class="mb-1 block text-sm font-medium">본문</span><div class="rounded-xl border border-line bg-bg"><div class="scroll-x flex gap-1 border-b border-line p-2" role="toolbar" aria-label="서식">' + tools.map(function (t) { return '<button type="button" class="whitespace-nowrap rounded-md px-2.5 py-1 text-[13px] hover:bg-surface">' + t + '</button>'; }).join('') + '</div><label class="sr-only" for="w-body">본문</label><textarea id="w-body" rows="12" class="w-full resize-y bg-transparent p-4 text-[16px]" placeholder="여기에 글을 써요. 이미지는 10MB까지 본문에 넣을 수 있어요."></textarea></div></div>' +
      '<div><span class="mb-1 block text-sm font-medium">파일 첨부 <span class="font-normal text-mute">(25MB 이하, 글당 5개)</span></span><label for="w-file" class="flex cursor-pointer flex-col items-center gap-1 rounded-xl border border-dashed border-line px-4 py-6 text-center text-sm text-mute hover:border-accent">' + I.file + '<span>파일을 끌어다 놓거나 눌러서 고르기</span><span class="text-[12px]">html, svg, exe는 올릴 수 없어요</span></label><input id="w-file" type="file" class="sr-only" multiple>' + (files ? '<ul class="mt-3 divide-y divide-line rounded-xl border border-line">' + files + '</ul>' : '') + '<button type="button" data-act="addfile" class="mt-2 text-[13px] text-accent underline">예시 파일 추가해 보기</button></div>' +
    '</div><aside class="space-y-6"><div class="rounded-2xl border border-line bg-surface p-4"><label class="block"><span class="mb-1 block text-sm font-medium">메뉴</span><select id="w-cat" class="' + field + '">' + MENUS.map(function (m) { return '<option value="' + m.slug + '">' + m.name + (m.vis === 'private' ? ' (나만 보기)' : '') + '</option>'; }).join('') + '</select></label>' +
      '<fieldset class="mt-4"><legend class="mb-1 text-sm font-medium">공개 범위</legend><div class="grid grid-cols-2 gap-2">' + [['public', '공개'], ['private', '나만 보기']].map(function (v) { return '<button type="button" data-act="vis" data-arg="' + v[0] + '" aria-pressed="' + (S.vis === v[0]) + '" class="rounded-lg border px-3 py-2 text-sm ' + (S.vis === v[0] ? 'border-accent bg-soft text-accent' : 'border-line') + '">' + v[1] + '</button>'; }).join('') + '</div></fieldset></div>' +
      '<div class="rounded-2xl border border-line bg-surface p-4"><p class="mb-2 text-sm font-medium">대표 이미지</p><div class="grid grid-cols-3 gap-2">' + swatches + '</div><label for="w-img" class="mt-3 block cursor-pointer rounded-lg border border-line px-3 py-2 text-center text-sm hover:bg-bg">내 사진 올리기 (10MB 이하)</label><input id="w-img" type="file" accept="image/*" class="sr-only"></div>' +
      '<div class="flex gap-2">' + btn('저장하고 올리기', { cls: 'flex-1' }).replace('type="button"', 'type="submit"') + btn('미리보기', { kind: 'ghost', href: '#post-tiger' }) + '</div><p id="wmsg" role="status" class="text-sm text-accent"></p></aside></form>');
}
function viewAdminMenus() {
  var rows = MENUS.map(function (m, i) {
    return '<li class="flex flex-wrap items-center gap-3 px-4 py-3"><span class="cursor-grab text-mute" aria-hidden="true">⋮⋮</span><label class="sr-only" for="mn-' + i + '">메뉴 이름</label><input id="mn-' + i + '" value="' + m.name + '" class="w-40 rounded-md border border-line bg-bg px-2 py-1.5 font-mono text-sm uppercase"><span class="font-mono text-[12px] text-mute">/' + m.slug + '/</span><span class="ml-auto flex items-center gap-3"><button type="button" data-act="mvis" data-arg="' + i + '" aria-pressed="' + (m.vis === 'public') + '" class="rounded-full border px-3 py-1 text-[13px] ' + (m.vis === 'public' ? 'border-accent bg-soft text-accent' : 'border-line text-mute') + '">' + (m.vis === 'public' ? '공개' : '나만 보기') + '</button><button type="button" data-act="mdel" data-arg="' + i + '" class="text-[13px] text-danger hover:underline">삭제</button></span></li>';
  }).join('');
  return adminShell('admin-menus', '메뉴 관리',
    '<ul class="divide-y divide-line rounded-2xl border border-line bg-surface">' + rows + '</ul>' +
    '<form id="mform" class="mt-4 flex flex-col gap-2 sm:flex-row"><label class="sr-only" for="m-new">새 메뉴 이름</label><input id="m-new" value="' + esc(S.newMenu) + '" placeholder="새 메뉴 이름 (예: PLAYGROUND)" class="flex-1 rounded-lg border border-line bg-surface px-3 py-2.5 text-sm">' + btn('메뉴 추가').replace('type="button"', 'type="submit"') + '</form>' +
    '<p class="mt-3 text-[12px] text-mute">나만 보기 메뉴의 글은 방문자에게 보이지 않고, 메뉴 이름도 방문자용 사이드바에 나오지 않아요.</p>');
}

/* ---------- 로그인 창 ---------- */
function renderModal() {
  var el = $('#modal');
  if (!el) { el = document.createElement('div'); el.id = 'modal'; document.body.appendChild(el); }
  el.innerHTML = S.loginOpen
    ? '<div class="fixed inset-0 z-50 grid place-items-center bg-ink/50 p-4" data-act="close-login"><div role="dialog" aria-modal="true" aria-labelledby="lg-h" class="w-full max-w-sm rounded-2xl border border-line bg-surface p-6 shadow-xl" onclick="event.stopPropagation()"><h2 id="lg-h" class="font-display text-xl font-bold">Google로 로그인</h2><p class="mt-2 text-sm text-mute">댓글을 쓰고 @ 알림을 받을 수 있어요. 공개되는 정보는 이름과 작성 시각뿐이에요. <a class="underline" href="#privacy" data-act="close-login">개인정보 처리방침</a></p><div class="mt-5 flex flex-col gap-2">' + btn(I.g + 'Google로 계속하기', { act: 'login', id: 'lg-go' }) + btn('닫기', { kind: 'ghost', act: 'close-login' }) + '</div></div></div>'
    : '';
  if (S.loginOpen) { var go = $('#lg-go'); if (go) go.focus(); }
}

/* ---------- 라우터 ---------- */
function route() { var h = (location.hash || '#home').slice(1); return h || 'home'; }
function render() {
  var r = route(), v;
  S.shareOpen = (r.indexOf('post-') === 0) ? S.shareOpen : false;
  if (r === 'home') v = viewHome();
  else if (r === 'posts' || r === 'portfolio' || r === 'study') v = viewList(r);
  else if (r.indexOf('post-') === 0) v = viewPost(r.slice(5));
  else if (r === 'about') v = viewAbout();
  else if (r === 'privacy') v = viewPrivacy();
  else if (r === 'mentions') v = viewMentions();
  else if (r === 'admin-login') v = viewAdminLogin();
  else if (r === 'admin-posts') v = viewAdminPosts();
  else if (r === 'admin-write') v = viewAdminWrite();
  else if (r === 'admin-menus') v = viewAdminMenus();
  else v = view404();
  renderHeader(r); $('#app').innerHTML = v; renderFooter(); renderModal();
}
window.addEventListener('hashchange', function () { S.menuOpen = false; S.q = ''; S.delId = null; render(); window.scrollTo(0, 0); });

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.getAttribute('data-act'), arg = t.getAttribute('data-arg');
  if (a === 'theme') { var d = document.documentElement; var dark = d.getAttribute('data-theme') ? d.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; d.setAttribute('data-theme', dark ? 'light' : 'dark'); return; }
  if (a === 'menu') S.menuOpen = !S.menuOpen;
  else if (a === 'open-login') { S.loginOpen = true; S.menuOpen = false; }
  else if (a === 'close-login') S.loginOpen = false;
  else if (a === 'login') { S.user = 'visitor'; S.loginOpen = false; }
  else if (a === 'logout') { S.user = null; if (route().indexOf('admin') === 0 || route() === 'mentions') location.hash = '#home'; }
  else if (a === 'admin-login') { S.user = 'admin'; location.hash = '#admin-posts'; }
  else if (a === 'share') { S.shareOpen = !S.shareOpen; S.copied = false; }
  else if (a === 'copy') { S.copied = true; try { navigator.clipboard.writeText($('#surl').value).catch(function () { $('#surl').select(); }); } catch (err) { $('#surl').select(); } }
  else if (a === 'del') S.delId = arg;
  else if (a === 'del-no') S.delId = null;
  else if (a === 'del-yes') { POSTS = POSTS.filter(function (p) { return p.id !== arg; }); S.delId = null; }
  else if (a === 'vis') S.vis = arg;
  else if (a === 'thumb') S.thumb = +arg;
  else if (a === 'addfile') { if (S.files.length < 5) S.files.push('예시-보고서-' + (S.files.length + 1) + '.pdf'); }
  else if (a === 'rmfile') S.files.splice(+arg, 1);
  else if (a === 'mvis') MENUS[+arg].vis = MENUS[+arg].vis === 'public' ? 'private' : 'public';
  else if (a === 'mdel') MENUS.splice(+arg, 1);
  else if (a === 'reply') { var ta = $('#ctext'); if (ta) { ta.focus(); ta.value = '@'; } else { S.loginOpen = true; } }
  render();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; $('#rows').innerHTML = listRows(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'sort') { S.sort = e.target.value; $('#rows').innerHTML = listRows(); }
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var id = e.target.id;
  if (id === 'cform') {
    var p = byId(route().slice(5)), v = $('#ctext').value.trim(); if (!v) return;
    p.comments.push({ name: S.user === 'admin' ? '관리자' : '김지우', admin: S.user === 'admin', time: '방금', text: v }); render();
  } else if (id === 'wform') {
    $('#wmsg').textContent = $('#w-title').value.trim() ? '저장했어요. (미리보기라 실제로 올라가지는 않아요)' : '제목을 입력해 주세요.';
  } else if (id === 'mform') {
    var n = $('#m-new').value.trim(); if (!n) return;
    MENUS.push({ slug: n.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'menu', name: n.toUpperCase(), vis: 'public' }); S.newMenu = ''; render();
  }
});
addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.loginOpen) { S.loginOpen = false; render(); } });
render();
</script>
