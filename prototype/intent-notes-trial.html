function cleanNode(src,dst){
 Array.prototype.forEach.call(src.childNodes,function(n){
  if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue));return}
  if(n.nodeType!==1)return;
  var t=n.tagName;
  if(t==='SCRIPT'||t==='STYLE'||t==='IFRAME'||t==='OBJECT'||t==='EMBED'||t==='TEMPLATE'||t==='NOSCRIPT')return;
  var name=TAG[t];
  if(name==='a'){var h=n.getAttribute('href')||'';if(!/^https?:\/\//i.test(h))name=null}
  if(!name){cleanNode(n,dst);return}
  var el=document.createElement(name);
  if(name==='a'){el.setAttribute('href',n.getAttribute('href'));el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}
  var sty=n.style?cleanStyle(n.style):'',al=n.getAttribute('align');
  if(al&&/^(left|center|right|justify)$/.test(al))sty+=(sty?';':'')+'text-align:'+al;
  if(sty&&name!=='br')el.setAttribute('style',sty);
  if(name!=='br')cleanNode(n,el);
  dst.appendChild(el)})}
function sanitize(html){
 var doc=new DOMParser().parseFromString('<!doctype html><body>'+(html||''),'text/html'),box=document.createElement('div');
 cleanNode(doc.body,box);return box.innerHTML}
function textOf(html){var d=document.createElement('div');d.innerHTML=html;return d.textContent||''}
var savedRange=null;
function edEl(){return document.getElementById('wed')}
function restoreSel(){var ed=edEl();if(!ed)return false;ed.focus();var s=window.getSelection();if(savedRange){s.removeAllRanges();s.addRange(savedRange)}return s.rangeCount>0&&ed.contains(s.anchorNode)}
function hasSel(){var s=window.getSelection();return s.rangeCount>0&&!s.isCollapsed}
function syncEd(){var ed=edEl();if(ed&&draft)draft.html=ed.innerHTML}
function tbNote(msg){var n=document.getElementById('tbnote');if(n){n.textContent=msg;n.hidden=!msg}}
// 글꼴, 크기, 굵기, 색은 선택한 글자에만 적용해요.
function applyStyle(st){
 if(!restoreSel()||!hasSel()){tbNote('먼저 서식을 바꿀 글자를 드래그해서 선택하세요.');return}
 tbNote('');
 document.execCommand('styleWithCSS',false,true);
 document.execCommand('foreColor',false,'#010203');
 var ed=edEl();
 Array.prototype.slice.call(ed.querySelectorAll('span,font')).forEach(function(s){
  var c=(s.style&&s.style.color)||s.getAttribute('color')||'';
  if(c==='rgb(1, 2, 3)'||String(c).toLowerCase()==='#010203'){
   if(s.tagName==='FONT'){var sp=document.createElement('span');while(s.firstChild)sp.appendChild(s.firstChild);s.parentNode.replaceChild(sp,s);s=sp}
   s.style.color='';for(var k in st)s.style[k]=st[k];if(!s.getAttribute('style'))s.removeAttribute('style')}});
 document.execCommand('styleWithCSS',false,false);
 syncEd()}
function fmt(v){
 if(v==='link'){if(!restoreSel()||!hasSel()){tbNote('링크로 만들 글자를 먼저 선택하세요.');return}tbNote('');var r=document.getElementById('linkrow');r.hidden=false;document.getElementById('linkurl').focus();return}
 if(!restoreSel())return;
 var m={bold:'bold',italic:'italic',underline:'underline',strike:'strikeThrough',ul:'insertUnorderedList',ol:'insertOrderedList'};
 var al={left:'justifyLeft',center:'justifyCenter',right:'justifyRight'};
 document.execCommand('styleWithCSS',false,!!al[v]);
 if(m[v])document.execCommand(m[v]);
 else if(al[v])document.execCommand(al[v]);
 else if(v==='h2'||v==='h3'||v==='p')document.execCommand('formatBlock',false,v.toUpperCase());
 else if(v==='quote')document.execCommand('formatBlock',false,'BLOCKQUOTE');
 else if(v==='clear'){document.execCommand('removeFormat');document.execCommand('formatBlock',false,'P')}
 document.execCommand('styleWithCSS',false,false);
 syncEd()}

  +'</div><p class="hint" id="tbnote" role="status" hidden></p>'
  +'<div class="linkrow" id="linkrow" hidden><label class="sr" for="linkurl">링크 주소</label><input id="linkurl" type="url" placeholder="https://"><button type="button" class="btn sm pri" data-a="linkok">적용</button><button type="button" class="btn sm" data-a="linkcancel">취소</button></div>'}

function okImg(u){return /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(u||'')}
function thumbInner(p){return p.img&&okImg(p.img)?'<img src="'+p.img+'" alt="">':THUMBS[(p.thumb||0)%THUMBS.length]}

var VKEY='intent_views';

function loadViews(){try{var v=JSON.parse(localStorage.getItem(VKEY)||'{}');posts.forEach(function(p){if(p.id<=9&&typeof v[p.id]==='number')p.views=Math.max(p.views||0,v[p.id])})}catch(e){}}

// 방문자가 글을 열 때마다 1씩 올려요. 회고 메뉴 글과 관리자가 열어 본 것은 세지 않아요.

function copyUrl(){
 var p=find(curPost());if(!p||!shareable(p))return;var url=postUrl(p),msg=document.getElementById('smsg');
 function done(t){shareMsg=t;if(msg)msg.textContent=t}
 function fallback(){var i=document.getElementById('surl');if(i){i.focus();i.select();try{if(document.execCommand('copy')){done('복사했어요.');return}}catch(x){}}done('주소를 선택했어요. Ctrl+C(Mac은 Cmd+C)로 복사해 주세요.')}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){done('복사했어요.')},fallback)}else fallback()}

function thumbFile(inp){
 var f=inp.files&&inp.files[0];if(!f)return;syncDraft();

 if(f.size>1048576){say('이미지는 1MB 이하만 올릴 수 있어요.',true);render(true);return}
 var rd=new FileReader();rd.onload=function(){if(okImg(rd.result)&&draft){draft.img=rd.result;render(true)}else{say('이미지를 읽지 못했어요.',true);render(true)}};rd.readAsDataURL(f)}
